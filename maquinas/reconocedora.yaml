---
# Reconoce cadenas de la forma a^n b^n c^n con n >= 1
# En cada vuelta cambia una a por X, una b por Y y una c por Z
q_states:
  q_list:
  - '0'
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  initial: '0'
  final: '5'
alphabet:
- a
- b
- c
tape_alphabet:
- a
- b
- c
- X
- Y
- Z
-
delta:
# Estado 0: marca la primera a, o si ya no hay a pasa a revisar el final
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '4'
    mem_cache_value:
    tape_output: Y
    tape_displacement: R
# Estado 1: busca la primera b sin marcar
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: Y
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '2'
    mem_cache_value:
    tape_output: Y
    tape_displacement: R
# Estado 2: busca la primera c sin marcar
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '2'
    mem_cache_value:
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: Z
  output:
    final_state: '2'
    mem_cache_value:
    tape_output: Z
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: c
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: Z
    tape_displacement: L
# Estado 3: regresa a la izquierda hasta la ultima X
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: Y
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: Z
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: Z
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: X
  output:
    final_state: '0'
    mem_cache_value:
    tape_output: X
    tape_displacement: R
# Estado 4: revisa que solo queden Y y Z hasta el blanco
- params:
    initial_state: '4'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '4'
    mem_cache_value:
    tape_output: Y
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value:
    tape_input: Z
  output:
    final_state: '4'
    mem_cache_value:
    tape_output: Z
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value:
    tape_input:
  output:
    final_state: '5'
    mem_cache_value:
    tape_output:
    tape_displacement: S
simulation_strings:
- aabbcc
- aaabbbccc
- aabbbcc
- aabcbc
