---
# Copia la cadena: w se convierte en w#w
# Cada simbolo se marca (a con X, b con Y), se guarda en la cache y se escribe al final
q_states:
  q_list:
  - '0'
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '7'
  initial: '0'
  final: '7'
alphabet:
- a
- b
tape_alphabet:
- a
- b
- X
- Y
- "#"
-
delta:
# Estado 0: va hasta el final de la cadena y pone el #
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '0'
    mem_cache_value:
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '0'
    mem_cache_value:
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input:
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
# Estado 1: regresa al inicio de la cadena
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '1'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: '1'
    mem_cache_value:
    tape_input:
  output:
    final_state: '2'
    mem_cache_value:
    tape_output:
    tape_displacement: R
# Estado 2: marca el siguiente simbolo y lo guarda en la cache, o si llega al # ya termino de copiar
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value: a
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value: b
    tape_output: Y
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: '6'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
# Estado 3: con el simbolo en la cache avanza hasta el #
- params:
    initial_state: '3'
    mem_cache_value: a
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value: a
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '3'
    mem_cache_value: a
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value: a
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '3'
    mem_cache_value: a
    tape_input: "#"
  output:
    final_state: '4'
    mem_cache_value: a
    tape_output: "#"
    tape_displacement: R
- params:
    initial_state: '3'
    mem_cache_value: b
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value: b
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '3'
    mem_cache_value: b
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value: b
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '3'
    mem_cache_value: b
    tape_input: "#"
  output:
    final_state: '4'
    mem_cache_value: b
    tape_output: "#"
    tape_displacement: R
# Estado 4: avanza hasta el final de la copia y escribe lo que tiene en la cache
- params:
    initial_state: '4'
    mem_cache_value: a
    tape_input: a
  output:
    final_state: '4'
    mem_cache_value: a
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value: a
    tape_input: b
  output:
    final_state: '4'
    mem_cache_value: a
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value: a
    tape_input:
  output:
    final_state: '5'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '4'
    mem_cache_value: b
    tape_input: a
  output:
    final_state: '4'
    mem_cache_value: b
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value: b
    tape_input: b
  output:
    final_state: '4'
    mem_cache_value: b
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value: b
    tape_input:
  output:
    final_state: '5'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
# Estado 5: regresa hasta la ultima X o Y
- params:
    initial_state: '5'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '5'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '5'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '5'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: '5'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: '5'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
- params:
    initial_state: '5'
    mem_cache_value:
    tape_input: X
  output:
    final_state: '2'
    mem_cache_value:
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '5'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '2'
    mem_cache_value:
    tape_output: Y
    tape_displacement: R
# Estado 6: devuelve las X y Y a su letra original
- params:
    initial_state: '6'
    mem_cache_value:
    tape_input: X
  output:
    final_state: '6'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '6'
    mem_cache_value:
    tape_input: Y
  output:
    final_state: '6'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: '6'
    mem_cache_value:
    tape_input:
  output:
    final_state: '7'
    mem_cache_value:
    tape_output:
    tape_displacement: R
simulation_strings:
- abbab
- aaaaa
- babbaa
- bbababa
